name: ci
on:
  push:
    branches:
      - "**"

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.ref }}-${{ github.workflow }}
  # A newer push supersedes a branch run, but a default-branch run may be releasing.
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
  test:
    uses: ./.github/workflows/tests.yml
    permissions:
      actions: read
      id-token: write
      contents: read
      deployments: write
  verify:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "mise - install tools"
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: 2026.11.12
          install: true # run mise install
          cache: true

      - name: ci
        run: make ci

      - uses: ./aikido-upload-coverage
        if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        with:
          file-paths: "coverage/lcov.info"

  conditional-release:
    needs:
      - verify
      - test
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "mise - install tools"
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: 2026.11.12
          install: true # run mise install
          cache: true
      - name: "install dependencies"
        run: bun install --frozen-lockfile
      - name: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run semantic-release
